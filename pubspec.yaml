name: berik_tulga
description: Morning walks, stronger habits, and shared territory in Kyzylorda.
publish_to: none
version: 0.1.7+8
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  supabase_flutter: ^2.18.0
  maplibre_gl: ^0.27.1
  geolocator: ^14.1.1
  pedometer: ^4.2.0
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  image_picker: ^1.2.1
  cupertino_icons: ^1.0.9
  pointer_interceptor: ^0.10.1+3
  path_provider: ^2.1.5
  # Use the platform-channel implementations with this Windows Flutter toolchain.
  # New JNI/ObjC build hooks currently fail before compilation on this host.
  path_provider_android: 2.2.23
  path_provider_foundation: 2.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0
flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  assets:
    - assets/maps/
    - assets/maps/glyphs/Noto Sans Regular/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
