<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Берік Тұлға — Қадам бас. Аумақты иелен. Өзіңді жең.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Берік Тұлға">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Берік Тұлға</title>
  <style>
    html,body { margin:0; height:100%; background:#080A0D; color:#F5F6F8; }
    #loading { position:fixed; inset:0; display:grid; place-content:center; text-align:center; font-family:system-ui,sans-serif; gap:20px; }
    #loading strong { letter-spacing:3px; font-size:20px; }
    #loading span { color:#ABB3BF; font-size:13px; }
    #loading i { width:36px; height:4px; background:#FF673B; border-radius:4px; margin:auto; }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading"><i></i><strong>БЕРІК ТҰЛҒА</strong><span>Қадам бас. Аумақты иелен. Өзіңді жең.</span></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js?offline=0.1.1" async></script>
</body>
</html>
